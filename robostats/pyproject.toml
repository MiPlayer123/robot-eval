[project]
name = "robostats"
version = "0.0.1"
description = "Honest statistics for robot policy evaluation"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robostats*"]
